services:
  app:
    # Jenkins IMAGE aur TAG set karega (jaise IMAGE=user/expense-tracker TAG=42).
    # Local pe kuch set na ho to expense-tracker:latest build hoga.
    image: ${IMAGE:-expense-tracker}:${TAG:-latest}
    build: .
    container_name: expense-app

    # Saare secrets (DATABASE_URL, BETTER_AUTH_SECRET, API keys...) .env se aate hain.
    # .env git mein nahi jata; Jenkins use "Secret file" credential se banayega.
    env_file:
      - .env

    ports:
      - "3000:3000"

    restart: unless-stopped

    # Free tier (1 GB RAM) pe server ko hang hone se bachane ke liye
    mem_limit: 512m

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Logs se disk full na ho
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
