services:
  postgres_db:
    image: postgres:17
    container_name: postgres-db
    environment: 
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: 
     - "127.0.0.1:5434:5432"

    volumes:
      - app_db:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: expense-tracker:dev
    container_name: expense-app
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env

    environment:    
      DATABASE_URL: postgresql://neondb_owner:npg_52GweuoETZLJ@ep-soft-base-apz06tg5-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require 

    ports:
     - "3000:3000"

    restart: unless-stopped 


volumes:
  app_db: