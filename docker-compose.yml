services:
  postgres_db:
    image: postgres:latest
    container_name: postgres-db
    environment: 
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: 
     - "5433:5432"

    volumes:
      - app_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes: 
  app_db:
